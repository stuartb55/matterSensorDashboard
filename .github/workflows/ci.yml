name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # There is no test suite, so this is the safety net: it boots the real
      # server against a closed port and asserts the behaviour that does not
      # depend on InfluxDB — the registry renders, the build is served, and an
      # unreachable upstream degrades to 503 instead of crashing the process.
      - name: Smoke-test the server
        env:
          INFLUX_TOKEN: ci-placeholder
          INFLUX_URL: http://127.0.0.1:9
          PORT: "8090"
        run: |
          set -euo pipefail
          node server/index.js &
          pid=$!
          trap 'kill $pid' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/sensors >/dev/null && break
            sleep 1
          done

          echo "registry is served"
          curl -sf http://127.0.0.1:8090/api/sensors | grep -q '"living_room"'

          echo "built frontend is served"
          curl -sf http://127.0.0.1:8090/ | grep -q '<div id="root">'

          echo "unreachable upstream reports unhealthy, not dead"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/health)" = 503

          echo "unknown API paths 404 instead of falling back to the shell"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/nope)" = 404

  docker:
    name: Build image
    runs-on: ubuntu-latest

    # Only smoke-tested code gets published. On a pull request this still runs
    # after the build job and proves the Dockerfile works, it just pushes
    # nothing.
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated. Only the runtime stage runs under it — the frontend
      # build stage is pinned to the builder's own architecture — and the
      # runtime dependencies are pure JavaScript, so the emulated work is one
      # `npm ci --omit=dev`.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      # Pull requests build and stop there — a fork PR has no write access to
      # the registry anyway, and an unreviewed branch must never become
      # `:latest`.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what docker-compose.yml pulls; the sha tag is the rollback
      # handle. metadata-action also stamps org.opencontainers.image.source,
      # which is what links the package to this repository on GitHub.
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/stuartb55/sensordashboard
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.description=Mobile-first temperature and humidity dashboard reading from InfluxDB 3

      # The deployment host is arm64 (Apple silicon); amd64 stays so the image
      # still runs on an x86 host. A single-platform image makes `docker
      # compose pull` fail on the other architecture with "no matching
      # manifest", which is how this list last went wrong.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
