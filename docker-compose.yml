services:
  dashboard:
    # Published to GitHub Packages by CI on every push to main, so the host
    # deploys with `docker compose pull && docker compose up -d` instead of
    # compiling the frontend here. `--build` still builds from this checkout
    # when iterating locally, and pinning a `:sha-<commit>` tag from
    # https://github.com/stuartb55/matterSensorDashboard/pkgs/container/mattersensordashboard
    # rolls back to any earlier build.
    image: ghcr.io/stuartb55/mattersensordashboard:latest
    pull_policy: always
    build: .
    container_name: sensor-dashboard
    restart: unless-stopped

    # Caddy runs on a different tailnet node, so this has to be
    # reachable across the tailnet rather than bound to loopback. This also
    # exposes it to the machine's LAN. To make it tailnet-only instead, change
    # this to "<dashboard-tailscale-ip>:8090:8090".
    ports:
      - "8090:8090"

    # Supplies influxdb_token and INFLUX_URL (see .env.example). Never baked
    # into the image.
    env_file:
      - .env

    environment:
      # Read from .env so the deployment address stays out of the repo. Use
      # InfluxDB's container name on the shared network or the host's address;
      # localhost:8181 would resolve to this container itself.
      INFLUX_URL: ${INFLUX_URL:?set INFLUX_URL in .env}
      PORT: "8090"
      NODE_ENV: production

    networks:
      - influxdb

networks:
  influxdb:
    external: true
    name: docker_influxdb-network
